<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dating with me~</title>
<meta name="description" content="可以和我一起约会嘛？点开选一个属于我们的约会计划。">
<meta name="theme-color" content="#fff0f5">
<meta property="og:type" content="website">
<meta property="og:title" content="Dating with me~">
<meta property="og:description" content="可以和我一起约会嘛？点开选一个属于我们的约会计划。">
<meta property="og:image" content="share-preview.jpg">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta name="twitter:card" content="summary">
<link rel="icon" href="share-preview.jpg">
<link rel="apple-touch-icon" href="share-preview.jpg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #ff6f91;
    --pink-light: #ffe7ef;
    --pink-dark: #d9416a;
    --cream: #fff7df;
    --mint: #b7eadb;
    --ink: #33282d;
    --bg: #fff5f0;
    --card-bg: rgba(255,255,255,0.88);
    --text: #33282d;
    --text-light: #8d747d;
    --radius: 26px;
    --radius-sm: 16px;
    --shadow: 0 24px 70px rgba(217, 65, 106, 0.16);
  }

  html, body {
    height: 100%;
    /* Prevent iOS overscroll bounce */
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
  }

  body {
    font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,111,145,0.28), transparent 28vw),
      radial-gradient(circle at 86% 16%, rgba(183,234,219,0.5), transparent 24vw),
      linear-gradient(135deg, #fff8e8 0%, #ffe8ed 48%, #f8fff8 100%);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh; /* iOS Safari fix */
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.28;
    background-image:
      linear-gradient(rgba(51,40,45,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(51,40,45,0.08) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 84%, transparent);
  }

  body::after {
    content: "DATE?";
    position: fixed;
    right: clamp(18px, 6vw, 78px);
    bottom: clamp(18px, 5vw, 70px);
    color: rgba(217,65,106,0.11);
    font-size: clamp(56px, 12vw, 160px);
    font-weight: 900;
    letter-spacing: 0;
    pointer-events: none;
  }

  /* ── Phone frame (desktop) ── */
  .phone {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    height: 100dvh;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,255,255,0.9), transparent 42%),
      linear-gradient(180deg, #fffaf1 0%, #fff0f5 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
  }
  @media (min-width: 768px) {
    .phone {
      width: min(420px, calc(100vw - 48px));
      height: min(820px, 88vh);
      border-radius: 42px;
      border: 10px solid #241d20;
      box-shadow:
        0 34px 90px rgba(72,31,45,0.24),
        inset 0 0 0 1px rgba(255,255,255,0.42);
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      width: 118px;
      height: 24px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: #241d20;
      z-index: 5;
      opacity: 0.96;
    }
  }

  /* ── Pages ── */
  .page {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 34px 24px;
    padding-bottom: max(32px, env(safe-area-inset-bottom));
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    will-change: transform, opacity;
  }
  .page--enter { transform: translateX(100%); opacity: 0; pointer-events: none; }
  .page--active { transform: translateX(0); opacity: 1; }
  .page--exit  { transform: translateX(-100%); opacity: 0; pointer-events: none; }

  /* ── Decorative blossoms ── */
  .blossom {
    position: absolute;
    font-size: 28px;
    pointer-events: none;
    filter: drop-shadow(0 8px 10px rgba(217,65,106,0.16));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-8px) rotate(5deg); }
  }

  /* ── Card ── */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.72);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    padding: 34px 26px 30px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(217,65,106,0.24);
    border-radius: calc(var(--radius) - 10px);
    pointer-events: none;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .back-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 3;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(51,40,45,0.12);
    border-radius: 50%;
    background: rgba(255,255,255,0.84);
    color: var(--ink);
    box-shadow: 0 8px 18px rgba(51,40,45,0.08);
    font: inherit;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .card--with-back h1 {
    padding-inline: 28px;
  }

  /* ── Avatar ── */
  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
  }
  .avatar {
    width: 102px;
    height: 102px;
    border-radius: 30px;
    border: 4px solid #fff;
    box-shadow: 0 12px 24px rgba(217,65,106,0.2), 0 0 0 3px var(--pink);
    object-fit: cover;
    display: block;
  }
  .blossom-avatar {
    position: absolute;
    top: -14px;
    right: -10px;
    font-size: 24px;
  }

  /* ── Typography ── */
  h1 {
    font-size: 28px;
    font-weight: 850;
    line-height: 1.28;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: 0;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-light);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* ── Buttons ── */
  .btn-row {
    display: flex;
    gap: 14px;
    width: 100%;
    margin-top: 8px;
  }
  .btn {
    flex: 1;
    padding: 14px 0;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, left 0.24s cubic-bezier(.2,.8,.2,1), top 0.24s cubic-bezier(.2,.8,.2,1);
    -webkit-tap-highlight-color: transparent;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled {
    opacity: 0.42;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
  button:focus-visible,
  textarea:focus-visible {
    outline: 3px solid rgba(217,65,106,0.34);
    outline-offset: 3px;
  }

  .btn--yes {
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    color: #fff;
    box-shadow: 0 12px 24px rgba(217,65,106,0.28);
  }
  .btn--no {
    background: rgba(255,255,255,0.9);
    color: var(--text);
    border: 1.5px solid rgba(51,40,45,0.14);
    box-shadow: 0 8px 20px rgba(51,40,45,0.08);
  }
  .btn--no.is-running-away {
    position: fixed;
    z-index: 120;
    width: 138px;
    flex: none;
    box-shadow: 0 22px 46px rgba(217,65,106,0.28);
  }
  .btn--no.is-relocating {
    animation: noNudge 0.28s ease-out;
  }
  @keyframes noNudge {
    0%   { transform: scale(0.94); }
    58%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes buttonReady {
    0%   { transform: translateY(0); }
    55%  { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }
  .btn--ready { animation: buttonReady 0.34s ease-out; }
  .btn--full {
    width: 100%;
    margin-top: 18px;
  }

  /* ── Calendar ── */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .cal-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .cal-arrows { display: flex; gap: 6px; }
  .cal-arrow {
    width: 32px; height: 32px;
    border-radius: 12px;
    border: 1px solid rgba(51,40,45,0.12);
    background: rgba(255,255,255,0.76);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .cal-arrow:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
    margin-bottom: 14px;
  }
  .cal-day-label {
    font-size: 12px;
    color: var(--text-light);
    padding: 6px 0;
    font-weight: 500;
  }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 12px;
    border: none;
    background: transparent;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cal-day:active { transform: scale(0.92); }
  .cal-day--other { color: #ccc; }
  .cal-day--today { border: 2px solid var(--pink); }
  .cal-day--selected {
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    color: #fff;
    font-weight: 700;
  }
  .cal-day--disabled {
    color: #ddd;
    cursor: not-allowed;
  }

  .selected-date-display {
    font-size: 15px;
    color: var(--pink-dark);
    font-weight: 600;
    margin-bottom: 18px;
  }

  /* ── Food grid ── */
  .food-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 76px;
    gap: 10px;
    width: 100%;
    margin-bottom: 10px;
    align-items: stretch;
  }
  @media (min-width: 380px) {
    .food-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 640px) {
    .food-grid { grid-template-columns: repeat(5, 1fr); }
  }
  .activity-grid {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 72px;
    gap: 8px;
  }
  .dining-grid {
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 76px;
    gap: 9px;
  }
  .food-btn {
    height: 100%;
    min-height: 76px;
    padding: 10px 8px;
    border-radius: 18px;
    border: 1.5px solid rgba(51,40,45,0.12);
    background: rgba(255,255,255,0.82);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    line-height: 1.2;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .food-btn:active { transform: scale(0.94); }
  .food-btn--selected {
    border-color: var(--pink);
    background: linear-gradient(180deg, #fff, var(--pink-light));
    font-weight: 600;
  }
  .food-btn--selected::after {
    content: "✓";
    position: absolute;
    top: 6px;
    right: 7px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--pink);
    color: #fff;
    font-size: 11px;
    line-height: 17px;
    text-align: center;
  }
  .food-emoji {
    font-size: 28px;
    line-height: 1;
  }
  .food-label {
    display: block;
    width: 100%;
    min-height: 17px;
    white-space: nowrap;
    word-break: keep-all;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .activity-grid .food-btn {
    min-height: 72px;
    padding: 8px 4px;
    font-size: 13px;
    border-radius: 16px;
    gap: 5px;
  }
  .activity-grid .food-emoji {
    font-size: 24px;
  }

  /* ── Extras textarea ── */
  .extras {
    width: 100%;
    margin-top: 10px;
  }
  .extras textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 18px;
    border: 1.5px solid rgba(51,40,45,0.12);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
  }
  .extras textarea:focus { border-color: var(--pink); }

  /* ── Fade-in animation ── */
  .fade-in {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeIn 0.5s 0.1s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Toast / confetti ── */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(51,40,45,0.92);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 99;
  }
  .toast--show { opacity: 1; }

  /* ── Page progress dots ── */
  .dots {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ddd;
    transition: background 0.3s;
  }
  .dot--active { background: var(--pink); }

  .no-copy {
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(520px, calc(100vw - 36px));
    transform: translate(-50%, -50%) scale(0.94);
    border: 1px solid rgba(255,255,255,0.78);
    border-radius: 28px;
    padding: 24px 26px;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 30px 80px rgba(51,40,45,0.22);
    color: var(--ink);
    text-align: center;
    font-size: clamp(20px, 3vw, 36px);
    font-weight: 850;
    line-height: 1.35;
    z-index: 110;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.26s ease, transform 0.26s ease;
  }
  .no-copy--show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .yes-dialog {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 28px;
    background: rgba(51,40,45,0.22);
    backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .yes-dialog--show {
    opacity: 1;
    pointer-events: auto;
  }
  .yes-dialog__panel {
    width: 100%;
    max-width: 330px;
    padding: 28px 24px 24px;
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 28px;
    background: rgba(255,255,255,0.94);
    box-shadow: 0 28px 70px rgba(51,40,45,0.24);
    text-align: center;
    transform: translateY(12px) scale(0.96);
    transition: transform 0.22s ease;
  }
  .yes-dialog--show .yes-dialog__panel {
    transform: translateY(0) scale(1);
  }
  .yes-dialog__emoji {
    font-size: 42px;
    margin-bottom: 12px;
  }
  .yes-dialog__title {
    font-size: 24px;
    font-weight: 850;
    line-height: 1.32;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .yes-dialog__small {
    font-size: 14px;
    color: var(--text-light);
    line-height: 1.6;
    margin-bottom: 22px;
  }

  /* ── Date ticket result ── */
  .result-view {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: max(38px, env(safe-area-inset-top)) 24px max(34px, env(safe-area-inset-bottom));
    overflow-y: auto;
    text-align: center;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.9), transparent 36%),
      linear-gradient(180deg, #fff8f2 0%, #ffe2ea 100%);
  }
  .result-view[hidden] { display: none; }
  .result-envelope {
    font-size: 58px;
    line-height: 1;
    filter: drop-shadow(0 12px 18px rgba(217,65,106,0.2));
  }
  .result-view--show .result-envelope {
    animation: envelopeArrive 0.62s cubic-bezier(.2,.8,.2,1) both;
  }
  .date-ticket {
    position: relative;
    width: 100%;
    max-width: 330px;
    padding: 28px 26px 26px;
    border: 1px solid rgba(255,255,255,0.84);
    border-radius: 26px;
    outline: 1px dashed rgba(217,65,106,0.28);
    outline-offset: -11px;
    background: rgba(255,255,255,0.94);
    box-shadow: 0 24px 58px rgba(217,65,106,0.18);
  }
  .result-view--show .date-ticket {
    animation: ticketReveal 0.52s 0.12s cubic-bezier(.2,.8,.2,1) both;
  }
  .ticket-stamp {
    display: inline-block;
    margin-bottom: 10px;
    color: var(--pink-dark);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0;
  }
  .ticket-title {
    margin-bottom: 4px;
    color: var(--pink-dark);
    font-size: 30px;
  }
  .ticket-subtitle {
    margin-bottom: 20px;
    color: var(--text-light);
    font-size: 13px;
  }
  .ticket-details {
    display: grid;
    gap: 10px;
    margin: 0;
    padding: 16px 0;
    border-top: 1px dashed rgba(217,65,106,0.22);
    border-bottom: 1px dashed rgba(217,65,106,0.22);
    text-align: left;
  }
  .ticket-row {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr);
    align-items: center;
    gap: 9px;
  }
  .ticket-row[hidden] { display: none; }
  .ticket-icon {
    font-size: 21px;
    text-align: center;
  }
  .ticket-copy {
    min-width: 0;
  }
  .ticket-label {
    display: block;
    margin-bottom: 1px;
    color: var(--text-light);
    font-size: 10px;
    font-weight: 700;
  }
  .ticket-value {
    display: block;
    overflow-wrap: anywhere;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.4;
  }
  .result-status {
    margin-top: 18px;
    color: var(--text-light);
    font-size: 14px;
    line-height: 1.6;
  }
  @keyframes envelopeArrive {
    from { transform: translateY(-18px) rotate(-7deg) scale(0.86); }
    to   { transform: translateY(0) rotate(0) scale(1); }
  }
  @keyframes ticketReveal {
    from { transform: translateY(16px) scale(0.97); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  @media (max-width: 767px) {
    body {
      background: linear-gradient(180deg, #fff7df 0%, #fff0f5 100%);
    }
    body::before,
    body::after {
      display: none;
    }
    .page {
      justify-content: flex-start;
      padding-top: max(42px, env(safe-area-inset-top));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }
    .page[data-page="1"] {
      padding-bottom: max(86px, calc(env(safe-area-inset-bottom) + 74px));
    }
    .card {
      margin-top: 7vh;
      max-width: 100%;
      box-shadow: 0 18px 44px rgba(217,65,106,0.12);
    }
    h1 {
      font-size: 30px;
    }
    .dots {
      bottom: max(22px, env(safe-area-inset-bottom));
    }
  }

  @media (max-width: 767px) and (max-height: 780px) {
    .page[data-page="1"] {
      padding-top: max(18px, env(safe-area-inset-top));
    }
    .page[data-page="1"] .card {
      margin-top: 0;
      padding: 24px 20px 22px;
    }
    .page[data-page="1"] .card > p:first-child {
      font-size: 30px !important;
      margin-bottom: 2px !important;
    }
    .page[data-page="1"] h1 {
      font-size: 26px;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .page[data-page="1"] .subtitle {
      margin-bottom: 12px;
    }
    .page[data-page="1"] .cal-header {
      margin-bottom: 8px;
    }
    .page[data-page="1"] .cal-grid {
      gap: 2px 4px;
      margin-bottom: 8px;
    }
    .page[data-page="1"] .cal-day-label {
      padding: 3px 0;
    }

      height: 34px;
      aspect-ratio: auto;
    }
    .page[data-page="1"] .selected-date-display {
      min-height: 18px;
      margin-bottom: 4px;
    }
    .page[data-page="1"] .btn-row {
      margin-top: 0;
    }
    .page[data-page="1"] .btn--full {
      margin-top: 8px;
    }
    .result-view {
      justify-content: flex-start;
      gap: 10px;
      padding-top: max(20px, env(safe-area-inset-top));

    .result-envelope { font-size: 46px; }
    .date-ticket { padding: 24px 24px 22px; }
    .ticket-subtitle { margin-bottom: 14px; }
    .ticket-details { padding-block: 12px; }
    .result-status { margin-top: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .blossom { animation: none !important; }
  }

  @media (min-width: 900px) {
    .page {
      padding-inline: 28px;
    }
    .card {
      transform: rotate(-1deg);
    }
    .page[data-page="1"] .card,
    .page[data-page="2"] .card,
    .page[data-page="3"] .card {
      transform: none;
    }
  }
</style>

function showYesDialog() {
  const dialog = document.getElementById("yesDialog");
  if (!dialog) return;
  dialog.classList.add("yes-dialog--show");
  dialog.setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => dialog.querySelector("button")?.focus());
}

function confirmYesDialog() {
  const dialog = document.getElementById("yesDialog");
  if (dialog) {
    dialog.classList.remove("yes-dialog--show");
    dialog.setAttribute("aria-hidden", "true");
  }
  goPage(1);
}

function goPage(n) {
  if (n === 1 && !selectedDate && currentPage === 0) {
    // Allow going to page 1 (date picker) from page 0
    // selectedDate not required yet
  }
  if (n !== 0) restoreNoButtonHome(document.querySelector(".btn--no"));
  animatePages(currentPage, n);
  currentPage = n;
  updateDots();
  if (n === 1) renderCalendar();
  if (n === 2) renderActivityGrid();
  if (n === 3) renderFoodGrid();
  const targetPage = document.querySelector(`.page[data-page="${n}"]`);
  if (targetPage) targetPage.scrollTop = 0;
}

function animatePages(from, to) {
  const pages = document.querySelectorAll(".page");
  const dots  = document.getElementById("dots");
  const movingBack = to < from;

  pages.forEach(p => {
    const idx = Number(p.dataset.page);
    if (idx === from) p.className = `page ${movingBack ? "page--enter" : "page--exit"}`;
    if (idx === to)   p.className = `page page--active fade-in`;
    if (idx !== from && idx !== to) {
      p.className = `page ${idx < to ? "page--exit" : "page--enter"}`;
    }
  });
  dots.className = "dots"; // keep dots visible
}

function updateDots() {
  document.querySelectorAll(".dot").forEach((d, i) => {
    d.classList.toggle("dot--active", i === currentPage);
  });
}


// ╔══════════════════════════════════════════╗
// ║  CALENDAR                              ║
// ╚══════════════════════════════════════════╝
function shiftMonth(delta) {
  const target = new Date(calYear, calMonth + delta, 1);
  const currentMonthStart = new Date(todayYear, todayMonth, 1);
  if (target < currentMonthStart) return;
  calYear = target.getFullYear();
  calMonth = target.getMonth();
  renderCalendar();
}

function renderCalendar() {
  const label = document.getElementById("calMonthLabel");
  const grid  = document.getElementById("calGrid");
  const previousButton = document.getElementById("calPrev");

  const monthNames = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
  label.textContent = `${calYear}年${monthNames[calMonth]}`;
  previousButton.disabled = calYear === todayYear && calMonth === todayMonth;

  // Build grid
  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

  // Weekday headers (make it a grid with 7 cols)
  const headers = "日一二三四五六".split("");

  let html = headers.map(h => `<div class="cal-day-label" aria-hidden="true">${h}</div>`).join("");

  // Previous month filler
  const startDay = firstDay;
  for (let i = 0; i < startDay; i++) {
    const d = daysInPrevMonth - startDay + i + 1;
    html += `<div class="cal-day cal-day--other cal-day--disabled" aria-hidden="true">${d}</div>`;
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    let cls = "cal-day";
    const isToday = calYear === todayYear && calMonth === todayMonth && d === todayDay;
    const isSelected = selectedDate && selectedDate.year === calYear && selectedDate.month === calMonth && selectedDate.day === d;
    if (isToday) {
      cls += " cal-day--today";
    }
    // Disable past dates
    const cellDate = new Date(calYear, calMonth, d);
    const today = new Date(todayYear, todayMonth, todayDay);
    if (cellDate < today) {
      cls += " cal-day--disabled";
    }
    // Check if selected
    if (isSelected) {
      cls += " cal-day--selected";
    }
    const disabledAttr = cellDate < today ? "disabled" : "";
    const currentAttr = isToday ? 'aria-current="date"' : "";
    html += `<button class="${cls}" type="button" onclick="pickDate(${calYear},${calMonth},${d})" aria-label="${calYear}年${calMonth + 1}月${d}日" aria-pressed="${Boolean(isSelected)}" ${currentAttr} ${disabledAttr}>${d}</button>`;
  }

  // Next month filler
  const totalCells = startDay + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    html += `<div class="cal-day cal-day--other cal-day--disabled" aria-hidden="true">${d}</div>`;
  }

  grid.innerHTML = html;
}

function pickDate(year, month, day) {
  const cellDate = new Date(year, month, day);
  const today = new Date(todayYear, todayMonth, todayDay);
  if (cellDate < today) return;

  selectedDate = { year, month, day, label: `${year}年${month+1}月${day}日` };
  document.getElementById("selectedDateDisplay").textContent = `已选：${selectedDate.label}`;
  const nextButton = document.getElementById("btnDateNext");
  nextButton.disabled = false;
  nextButton.classList.remove("btn--ready");
  requestAnimationFrame(() => nextButton.classList.add("btn--ready"));
  renderCalendar();
}


// ╔══════════════════════════════════════════╗
// ║  ACTIVITY / FOOD GRIDS                 ║
// ╚══════════════════════════════════════════╝
function renderActivityGrid() {
  const grid = document.getElementById("activityGrid");
  grid.innerHTML = activities.map(a => {
    const isSelected = selectedActivity === a.label;
    const sel = isSelected ? "food-btn--selected" : "";
    return `<button class="food-btn ${sel}" type="button" aria-pressed="${isSelected}" onclick="pickActivity('${a.label}')">
      <span class="food-emoji">${a.emoji}</span><span class="food-label">${a.label}</span>
    </button>`;
  }).join("");
}

function pickActivity(label) {
  selectedActivity = label;
  const nextButton = document.getElementById("btnActivityNext");
  nextButton.disabled = false;
  nextButton.classList.remove("btn--ready");
  requestAnimationFrame(() => nextButton.classList.add("btn--ready"));
  renderActivityGrid();
}

function renderFoodGrid() {
  const grid = document.getElementById("foodGrid");
  grid.innerHTML = foods.map(f => {
    const isSelected = selectedFood === f.label;
    const sel = isSelected ? "food-btn--selected" : "";
    return `<button class="food-btn ${sel}" type="button" aria-pressed="${isSelected}" onclick="pickFood('${f.label}')">
      <span class="food-emoji">${f.emoji}</span><span class="food-label">${f.label}</span>
    </button>`;
  }).join("");
  document.getElementById("btnSubmit").disabled = !selectedFood;
}

function pickFood(label) {
  selectedFood = label;
  renderFoodGrid();
  const submitButton = document.getElementById("btnSubmit");
  submitButton.classList.remove("btn--ready");
  requestAnimationFrame(() => submitButton.classList.add("btn--ready"));
}


// ╔══════════════════════════════════════════╗
// ║  SUBMIT                                ║
// ╚══════════════════════════════════════════╝
async function handleSubmit() {
  if (!selectedFood) {
    showToast("先选一个想吃的吧");
    return;
  }
  const note = document.getElementById("noteInput").value.trim();
  const dateLabel = selectedDate ? selectedDate.label : "未选日期";
  const activityLabel = selectedActivity || "未选活动";
  const foodLabel = selectedFood || "未选食物";

  const btn = document.getElementById("btnSubmit");
  btn.textContent = "发送中…";
  btn.disabled = true;

  try {
    await Promise.race([
      notifyAll(dateLabel, activityLabel, foodLabel, note).catch(e => null),
      new Promise(r => setTimeout(r, 3000)) // max 3s timeout
    ]);
  } catch (_) { /* ignore — we show confirmation regardless */ }

  // Show confirmation — no auto-popups, no tricks
  showConfetti(dateLabel, activityLabel, foodLabel, note);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("toast--show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("toast--show"), 1600);
}

async function notifyAll(dateLabel, activityLabel, foodLabel, note) {
  // Fire-and-forget both
  const jobs = [];
  if (SCKEY && SCKEY !== "__SCKEY__") jobs.push(notifyWeChat(dateLabel, activityLabel, foodLabel, note));
  if (EMAILJS_PUBLIC_KEY && EMAILJS_PUBLIC_KEY !== "__EMAILJS_PUBLIC_KEY__") {
    jobs.push(notifyEmail(dateLabel, activityLabel, foodLabel, note));
  }
  if (jobs.length > 0) await Promise.allSettled(jobs);
}

async function notifyWeChat(dateLabel, activityLabel, foodLabel, note) {
  const text = `${MY_NAME}，她回复了！\n\n📅 ${dateLabel}\n✨ ${activityLabel}\n🍖 ${foodLabel}${note ? '\n💬 '+note : ''}\n\n—— Dating Page`;
  // Image beacon: the only cross-origin method that works from file://
  new Image().src = `https://sctapi.ftqq.com/${SCKEY}.send?title=${encodeURIComponent("💘 她回复了")}&desp=${encodeURIComponent(text)}`;
  return true;
}

async function notifyEmail(dateLabel, activityLabel, foodLabel, note) {
  try {
    // EmailJS client-side SDK (loaded via CDN in head)
    const resp = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: EMAILJS_SERVICE_ID,
        template_id: EMAILJS_TEMPLATE_ID,
        user_id: EMAILJS_PUBLIC_KEY,
        template_params: {
          date: dateLabel,
          activity: activityLabel,
          food: foodLabel,
          note: note || "（无备注）",
          to_name: MY_NAME
        }
      })
    });
    console.log("Email notify:", resp.status);
    return resp.ok;
  } catch (e) {
    console.warn("Email failed:", e);
    return false;
  }
}


// ╔══════════════════════════════════════════╗
// ║  CONFIRMATION / CONFETTI               ║
// ╚══════════════════════════════════════════╝
function showConfetti(dateLabel, activityLabel, foodLabel, note) {
  document.querySelectorAll(".page").forEach(p => p.style.display = "none");
  document.getElementById("dots").style.display = "none";
  const resultView = document.getElementById("resultView");
  document.getElementById("resultDate").textContent = dateLabel;
  document.getElementById("resultActivity").textContent = activityLabel || "都可以";
  document.getElementById("resultFood").textContent = foodLabel || "什么都行";

  const noteRow = document.getElementById("resultNoteRow");
  noteRow.hidden = !note;
  document.getElementById("resultNote").textContent = note || "";

  resultView.hidden = false;
  resultView.scrollTop = 0;
  requestAnimationFrame(() => resultView.classList.add("result-view--show"));
}


// ╔══════════════════════════════════════════╗
// ║  EASTER EGG: "不要" button             ║
// ╚══════════════════════════════════════════╝
function handleNo() {
  const btn = document.querySelector(".btn--no");
  if (isDesktopPointer()) {
    moveNoButton(btn);
    showNoCopy();
    return;
  }
  btn.textContent = randomMobileNoCopy();
  setTimeout(() => { btn.textContent = "不要 💡"; }, 1000);
}

const noCopies = [
  "不可以点这里，系统会自动撒娇。",
  "这颗按钮今天请假了。",
  "再靠近一点，它就要逃去买花了。",
  "拒绝失败，请重新选择愿意。",
  "检测到犹豫：已为你加一点心动。",
  "不要按钮正在全屏躲猫猫。",
  "这个选项暂时被月老拦截。",
  "手滑也算愿意，真的。",
  "给个机会嘛，网页都写好了。"
];
const mobileNoCopies = [
  "再想想嘛~",
  "真的吗？",
  "给个机会嘛",
  "拜托拜托",
  "别这样嘛"
];

function isDesktopPointer() {
  return window.matchMedia("(hover: hover) and (pointer: fine)").matches;
}

let lastNoCopy = "";
let noCopyQueue = [];

function randomNoCopy() {
  if (noCopyQueue.length === 0) {
    noCopyQueue = [...noCopies];
    for (let i = noCopyQueue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [noCopyQueue[i], noCopyQueue[j]] = [noCopyQueue[j], noCopyQueue[i]];
    }
    if (noCopyQueue.length > 1 && noCopyQueue[0] === lastNoCopy) {
      [noCopyQueue[0], noCopyQueue[1]] = [noCopyQueue[1], noCopyQueue[0]];
    }
  }
  const next = noCopyQueue.shift();
  lastNoCopy = next;
  return next;
}

function randomMobileNoCopy() {
  return mobileNoCopies[Math.floor(Math.random() * mobileNoCopies.length)];
}

function showNoCopy() {
  let copy = document.getElementById("noCopy");
  if (!copy) {
    copy = document.createElement("div");
    copy.id = "noCopy";
    copy.className = "no-copy";
    document.body.appendChild(copy);
  }
  copy.textContent = randomNoCopy();
  copy.classList.add("no-copy--show");
  clearTimeout(showNoCopy.timer);
  showNoCopy.timer = setTimeout(() => copy.classList.remove("no-copy--show"), 1600);
}

let noButtonHome = null;
let noButtonNextSibling = null;
let noButtonEscapeLocked = false;

function moveNoButton(btn) {
  mountNoButtonToBody(btn);
  btn.classList.add("is-running-away");
  const gap = 24;
  const rect = btn.getBoundingClientRect();
  const width = Math.max(rect.width, 138);
  const height = Math.max(rect.height, 52);
  const maxLeft = Math.max(gap, window.innerWidth - width - gap);
  const maxTop = Math.max(gap, window.innerHeight - height - gap);
  btn.style.left = `${gap + Math.random() * (maxLeft - gap)}px`;
  btn.style.top = `${gap + Math.random() * (maxTop - gap)}px`;
  btn.classList.remove("is-relocating");
  void btn.offsetWidth;
  btn.classList.add("is-relocating");
}

function mountNoButtonToBody(btn) {
  if (!noButtonHome) {
    noButtonHome = btn.parentElement;
    noButtonNextSibling = btn.nextSibling;
  }
  if (btn.parentElement !== document.body) {
    document.body.appendChild(btn);
  }
}

function restoreNoButtonHome(btn) {
  if (!btn || !noButtonHome) return;
  btn.classList.remove("is-running-away", "is-relocating");
  btn.style.left = "";
  btn.style.top = "";
  if (btn.parentElement !== noButtonHome) {
    noButtonHome.insertBefore(btn, noButtonNextSibling);
  }
}

function initNoButtonEscape() {
  const btn = document.querySelector(".btn--no");
  if (!btn) return;
  const escape = () => {
    if (!isDesktopPointer() || noButtonEscapeLocked) return;
    noButtonEscapeLocked = true;
    moveNoButton(btn);
    showNoCopy();
    setTimeout(() => { noButtonEscapeLocked = false; }, 260);
  };
  btn.addEventListener("mouseenter", escape);
  btn.addEventListener("pointermove", (event) => {
    if (event.pointerType === "mouse") escape();
  });
  window.addEventListener("resize", () => {
    if (currentPage === 0 && isDesktopPointer() && btn.classList.contains("is-running-away")) {
      moveNoButton(btn);
    }
  });
}


// ╔══════════════════════════════════════════╗

// Render initial calendar
renderCalendar();
initNoButtonEscape();
